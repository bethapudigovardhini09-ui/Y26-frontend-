<!DOCTYPE html>
<html>
<head>
    <title>HTML Table</title>
    <link rel="stylesheet" href="tables.css">
</head>
<body>
    <h2>Student Details</h2>

    <table>
        <caption>College Student Details</caption>

        <tr>
            <th rowspan="2">Department</th>
            <th colspan="2">Student</th>
        </tr>

        <tr>
            <th>Name</th>
            <th>Year</th>
        </tr>

        <tr>
            <td rowspan="2">CSE</td>
            <td>Ravi</td>
            <td>II</td>
        </tr>

        <tr>
            <td>Sita</td>
            <td>III</td>
        </tr>

        <tr>
            <td>ECE</td>
            <td>Rahul</td>
            <td>II</td>
        </tr>
    </table>
</body>
</html>
